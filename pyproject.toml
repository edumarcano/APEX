[project]
name = "apex"
version = "2.0.0b1"
description = "Local-first personal intelligence HUD"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "fastapi",
    "fastembed==0.8.0",
    "fastmcp>=3.4.4,<4",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-genai>=1.56.0",
    "jsonschema>=4.26.0,<5",
    "msal>=1.33,<2",
    "msal-extensions>=1.3,<2",
    "openai>=1.75.0",
    "psutil",
    "pydantic",
    "pygame-ce",
    "python-dotenv",
    "pyttsx3",
    "requests",
    "tzdata",
    "uvicorn[standard]",
]

[project.scripts]
apex = "apex.cli:main"

[project.optional-dependencies]
tts-google = [
    "google-cloud-texttospeech",
]
tts-kokoro = [
    "kokoro-onnx",
    "numpy",
    "onnxruntime",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [".apex-uv-cache/**"]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
]
