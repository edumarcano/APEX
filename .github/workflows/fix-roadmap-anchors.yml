name: Fix roadmap anchors

on:
  push:
    branches:
      - docs/v1.19-final-reconciliation
    paths:
      - .github/workflows/fix-roadmap-anchors.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v1.19-final-reconciliation
          fetch-depth: 0
      - name: Correct roadmap anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/roadmap.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '#v1190---apex-agents--cortex-workspace': '#v1190---apex-agents-cortex-workspace',
              '#v1191---runtime-reliability--maintenance': '#v1191---runtime-reliability-maintenance',
              '#phase-vi-platform-consolidation--physical-integration': '#phase-vi-platform-consolidation-physical-integration',
              '#roadmap-navigation': '#navigation',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected roadmap anchor: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md
          git commit -m "docs: fix roadmap navigation anchors"
          git push origin HEAD:docs/v1.19-final-reconciliation
