name: Regenerate TTS lock

on:
  push:
    branches: [agent/improve-kokoro-tts]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/improve-kokoro-tts
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Regenerate lockfile
        run: uv lock

      - name: Commit lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git rm .github/workflows/update-tts-lock.yml
          git commit -m "chore: refresh TTS dependency lock"
          git push origin HEAD:agent/improve-kokoro-tts
