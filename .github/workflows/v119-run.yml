name: Run v1.19 reconciliation

on:
  push:
    branches:
      - docs/v1.19-final-reconciliation
    paths:
      - .github/workflows/v119-run.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v1.19-final-reconciliation
          fetch-depth: 0
      - name: Apply reconciliation
        shell: bash
        run: |
          python scripts/v119_reconcile.py
          python - <<'PY'
          from pathlib import Path

          scanner = Path('core/scanner.py')
          scanner.write_text(scanner.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')

          tests = Path('tests/test_settings_store.py')
          text = tests.read_text(encoding='utf-8')
          marker = '    def test_base_plus_local_loading(self) -> None:\n'
          addition = (
              '    def test_invalid_local_agent_falls_back_to_apodemus(self) -> None:\n'
              '        self.base["ask_apex"]["local_agent"] = "not-an-agent"\n'
              '        _write_json(self.config_path, self.base)\n'
              '        self.assertEqual(\n'
              '            self._store().get_snapshot().ask_apex.local_agent, "apodemus"\n'
              '        )\n\n'
          )
          if marker not in text:
              raise SystemExit('settings test insertion marker not found')
          tests.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
          if git grep -n "ENABLE_STARTUP_GATE" -- ':!CHANGELOG.md' ':!scripts/v119_reconcile.py' ':!.github/workflows'; then
            echo "Unexpected ENABLE_STARTUP_GATE reference remains outside release history/temp runner."
            exit 1
          fi
          if git grep -n "should_run()" -- ':!CHANGELOG.md' ':!scripts/v119_reconcile.py' ':!.github/workflows'; then
            echo "Unexpected legacy scanner gate reference remains outside release history/temp runner."
            exit 1
          fi
          git diff --check
      - name: Commit audited changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md core docs scripts/check_docs.py tests
          git commit -m "docs: reconcile v1.19 final documentation"
          git push origin HEAD:docs/v1.19-final-reconciliation

