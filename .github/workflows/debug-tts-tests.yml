name: Isolate TTS tests

on:
  push:
    branches: [agent/improve-kokoro-tts]

jobs:
  tts-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Sync base dependencies
        run: uv sync --locked
      - name: Run speaker tests verbosely
        run: uv run python -m unittest tests.test_speaker -v
