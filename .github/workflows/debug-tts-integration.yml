name: Isolate TTS integration

on:
  push:
    branches: [agent/improve-kokoro-tts]

jobs:
  tts-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Sync base dependencies
        run: uv sync --locked
      - name: Run API characterization
        run: uv run python -m unittest tests.test_api_characterization -v
      - name: Run briefing delivery
        run: uv run python -m unittest tests.test_briefing_delivery -v
