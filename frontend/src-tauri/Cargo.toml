[package]
name = "apex-desktop"
version = "2.0.0"
description = "APEX desktop shell"
authors = ["APEX"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt-multi-thread", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
windows = { version = "0.61", features = ["Foundation", "Devices_Geolocation", "UI_Notifications", "Data_Xml_Dom", "Win32_System_WinRT", "Win32_Graphics_Gdi"] }
windows-registry = "0.6"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
strip = true
